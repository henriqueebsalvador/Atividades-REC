    <g fill="#f0f5fa" stroke="#222" stroke-width="2">
      <ellipse cx="595" cy="160" rx="165" ry="32"/>
      <ellipse cx="595" cy="245" rx="165" ry="32"/>
      <ellipse cx="595" cy="330" rx="165" ry="32"/>
      <ellipse cx="595" cy="415" rx="165" ry="32"/>
